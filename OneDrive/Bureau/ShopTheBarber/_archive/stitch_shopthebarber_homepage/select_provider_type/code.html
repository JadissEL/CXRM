        <div class="px-40 flex flex-1 justify-center py-5">

            <h2 class="text-white tracking-light text-[28px] font-bold leading-tight px-4 text-center pb-3 pt-5">Select Provider Type</h2>
            <div class="p-4 @container">
              <div class="flex flex-col items-stretch justify-start rounded-xl @xl:flex-row @xl:items-start">

                  <div class="flex items-end gap-3 justify-between">
                    <p class="text-[#b99d9d] text-base font-normal leading-normal">Individual professional offering grooming services.</p>
                    <button
                      class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-xl h-8 px-4 bg-[#d41111] text-white text-sm font-medium leading-normal"
                    >
                      <span class="truncate">Select</span>
                    </button>
                  </div>
                </div>
              </div>
            </div>
            <div class="p-4 @container">
              <div class="flex flex-col items-stretch justify-start rounded-xl @xl:flex-row @xl:items-start">
                <div
                  class="w-full bg-center bg-no-repeat aspect-video bg-cover rounded-xl"
                  style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuBn964KXfDdRumL49dpnjyu1bKdDV9QJc1eE7oaZHJYKF0VErgZ0EXWxkoLrGLgcfpvY8UpecK4Hgp1t9I8SZAkviQdY2v_hfmILPtinhFw0KJgfl93TtcPXvUw5EKTTgl4sUaoy4N_DJDjhQ-tL9qZ9rCNOIHsbjIoiRwqw-LGzYEYFn2OC97kN272fALwcUpPpkkb5yQNHqCcaIukWtyjJ3noQ-c_QA-7R07WIvPhSBUFpluz5VQTJERHk2jw4zyFyRfIuJD6snU");'

                  <div class="flex items-end gap-3 justify-between">
                    <p class="text-[#b99d9d] text-base font-normal leading-normal">Established grooming business with multiple barbers.</p>
                    <button
                      class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-xl h-8 px-4 bg-[#d41111] text-white text-sm font-medium leading-normal"
                    >
                      <span class="truncate">Select</span>

              </div>
