<html>
  <head>
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin="" />
    <link
      rel="stylesheet"
      as="style"
      onload="this.rel='stylesheet'"
      href="https://fonts.googleapis.com/css2?display=swap&amp;family=Manrope%3Awght%40400%3B500%3B700%3B800&amp;family=Noto+Sans%3Awght%40400%3B500%3B700%3B900"
    />

    <title>Stitch Design</title>
    <link rel="icon" type="image/x-icon" href="data:image/x-icon;base64," />

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  </head>
  <body>
    <div class="relative flex h-auto min-h-screen w-full flex-col bg-white group/design-root overflow-x-hidden" style='font-family: Manrope, "Noto Sans", sans-serif;'>
      <div class="layout-container flex h-full grow flex-col">
        <header class="flex items-center justify-between whitespace-nowrap border-b border-solid border-b-[#f0f2f4] px-10 py-3">
          <div class="flex items-center gap-4 text-[#111317]">
            <div class="size-4">
              <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path
                  fill-rule="evenodd"
                  clip-rule="evenodd"
                  d="M12.0799 24L4 19.2479L9.95537 8.75216L18.04 13.4961L18.0446 4H29.9554L29.96 13.4961L38.0446 8.75216L44 19.2479L35.92 24L44 28.7521L38.0446 39.2479L29.96 34.5039L29.9554 44H18.0446L18.04 34.5039L9.95537 39.2479L4 28.7521L12.0799 24Z"
                  fill="currentColor"
                ></path>
              </svg>
            </div>
            <h2 class="text-[#111317] text-lg font-bold leading-tight tracking-[-0.015em]">Trimly</h2>
          </div>
          <div class="flex flex-1 justify-end gap-8">
            <div class="flex items-center gap-9">
              <a class="text-[#111317] text-sm font-medium leading-normal" href="#">Services</a>
              <a class="text-[#111317] text-sm font-medium leading-normal" href="#">Providers</a>
              <a class="text-[#111317] text-sm font-medium leading-normal" href="#">Locations</a>
            </div>
            <button
              class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-xl h-10 px-4 bg-[#f0f2f4] text-[#111317] text-sm font-bold leading-normal tracking-[0.015em]"
            >
              <span class="truncate">Log in</span>
            </button>
          </div>
        </header>
        <div class="px-40 flex flex-1 justify-center py-5">
          <div class="layout-content-container flex flex-col w-[512px] max-w-[512px] py-5 max-w-[960px] flex-1">
            <div class="flex flex-col gap-3 p-4">
              <div class="flex gap-6 justify-between"><p class="text-[#111317] text-base font-medium leading-normal">Step 2 of 3</p></div>
              <div class="rounded bg-[#dcdfe5]"><div class="h-2 rounded bg-[#111317]" style="width: 66%;"></div></div>
            </div>
            <h2 class="text-[#111317] tracking-light text-[28px] font-bold leading-tight px-4 text-center pb-3 pt-5">Confirm your booking</h2>
            <div class="p-4">
              <div class="flex items-stretch justify-between gap-4 rounded-xl">
                <div class="flex flex-[2_2_0px] flex-col gap-4">
                  <div class="flex flex-col gap-1">
                    <p class="text-[#646f87] text-sm font-normal leading-normal">Haircut</p>
                    <p class="text-[#111317] text-base font-bold leading-tight">Classic Fade</p>
                    <p class="text-[#646f87] text-sm font-normal leading-normal">with Alex</p>
                  </div>
                  <button
                    class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-xl h-8 px-4 flex-row-reverse bg-[#f0f2f4] text-[#111317] text-sm font-medium leading-normal w-fit"
                  >
                    <span class="truncate">Tue, Jul 23 · 10:00 AM</span>
                  </button>
                </div>
                <div
                  class="w-full bg-center bg-no-repeat aspect-video bg-cover rounded-xl flex-1"
                  style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuCRc5ESXUl1E6uqZ1-z2P20xkOIhvoFI1r34piWf7812ov30GEKVQBqJigvB01adN72Y43QoT9O07ykSwRoAItOlJgeivLdr9cLxrIDjOw-3nVpmNsRn4_m212bEb2xNNXhbBQTDMS2NRptfEGYFGL9ffjahZIrRsdF-1czu1Q7WTGVBeq8jJKsAbqQXieeonSAVoY-i5aQ1zpzVzKlEta7oZaV8nyotlR6g7Py6MptkmdV6k7mDjvGvoTlXWPTkmLVytNk9LLzpCg");'
                ></div>
              </div>
            </div>
            <div class="flex px-4 py-3">
              <button
                class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-xl h-12 px-5 flex-1 bg-[#194cb3] text-white text-base font-bold leading-normal tracking-[0.015em]"
              >
                <span class="truncate">Confirm and Pay</span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
