<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Quadriga Interview Flow - AI-powered interview management">
    <title>Quadriga Interview Flow 2.1</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Charts for Score Visualizations -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

    <!-- PDF Generator -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <!-- Modular Styles -->
    <!-- Modular Styles -->
    <link rel="stylesheet" href="/static/css/base.css?v=2.3">
    <link rel="stylesheet" href="/static/css/components.css?v=2.3">
    <link rel="stylesheet" href="/static/css/themes.css?v=2.3">
</head>

<body data-theme="light">

    <!-- Animated Background -->
    <div class="animated-bg"></div>

    <!-- Toast Container -->
    <div id="toastContainer" class="toast-container"></div>

    <!-- Header Component -->
    {% include 'components/header.html' %}

    <!-- Main Content -->
    <main class="container" style="margin-top: 2rem;">

        <!-- CV Upload Section -->
        {% include 'components/cv-upload.html' %}

        <!-- Interview Form -->
        {% include 'components/form-sections.html' %}

    </main>

    <!-- Keyboard Shortcuts Hint -->
    <div class="kbd-hint">
        <i data-lucide="keyboard" style="width: 16px; height: 16px;"></i>
        <span style="font-weight: 600;">Shortcuts:</span>
        <kbd class="kbd">Ctrl+S</kbd> Save
        <kbd class="kbd">Ctrl+G</kbd> PDF
        <kbd class="kbd">Ctrl+D</kbd> Dark
    </div>

    <!-- PDF Template (Hidden) -->
    {% include 'components/pdf-template.html' %}

    <!-- Scripts -->
    <script>lucide.createIcons();</script>
    <script src="/static/js/ui-components.js"></script>
    <script src="/static/js/cv-analyzer.js"></script>
    <script src="/static/js/form-manager.js"></script>
    <script src="/static/js/scoring-manager.js"></script>
    <script src="/static/js/main.js"></script>

</body>

</html>
