<header class="sticky-header">
    <div class="header-inner">
        <div class="logo-section">
            <div class="logo-icon">Q</div>
            <div class="logo-text">
                <h1>Quadriga Interview Flow</h1>
                <p>AI-Powered v2.1</p>
            </div>
        </div>
        <div class="header-actions">
            <!-- Theme Toggle -->
            <label class="theme-toggle" title="Toggle Dark Mode (Ctrl+D)">
                <input type="checkbox" id="themeToggle" style="display: none;">
                <div class="theme-toggle-slider"></div>
            </label>

            <!-- Generate PDF Button -->
            <button id="generateBtn" class="action-btn" title="Generate PDF (Ctrl+G)">
                <i data-lucide="file-text" style="width: 18px; height: 18px;"></i>
                Generate PDF
            </button>
        </div>
    </div>
</header>
